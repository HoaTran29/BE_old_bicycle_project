spring.application.name=old_bicycle_project
server.port=${PORT:8080}

# Debug Security
logging.level.org.springframework.security=DEBUG

# Database - Supabase Postgres
# Persistent Spring Boot backends should prefer direct connection or session pooler.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
server.forward-headers-strategy=framework

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===================== JWT =====================
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
# 15 phút (ms)
jwt.refresh-token-expiration=604800000
# 7 ngày (ms)

# ===================== Mail (Gmail SMTP) =====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================== Google OAuth2 =====================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# ===================== App Config =====================
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
auth.password-reset-expiration=3600000

# ===================== Payment / SePay =====================
payment.sepay.mock-mode=${SEPAY_MOCK_MODE:true}
payment.sepay.api-base-url=${SEPAY_API_BASE_URL:https://my.sepay.vn/userapi}
payment.sepay.api-token=${SEPAY_API_TOKEN:}
payment.sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
payment.sepay.bank-account-id=${SEPAY_BANK_ACCOUNT_ID:}
payment.sepay.bank-bin=${SEPAY_BANK_BIN:}
payment.sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
payment.sepay.account-name=${SEPAY_ACCOUNT_NAME:}
payment.expiry.scan-interval-ms=${PAYMENT_EXPIRY_SCAN_INTERVAL_MS:60000}
payment.expiry.initial-delay-ms=${PAYMENT_EXPIRY_INITIAL_DELAY_MS:15000}

# ===================== Assistant / Vercel AI Gateway =====================
assistant.gateway.enabled=${AI_GATEWAY_ENABLED:false}
assistant.gateway.api-base-url=${AI_GATEWAY_API_BASE_URL:https://ai-gateway.vercel.sh/v1/chat/completions}
assistant.gateway.api-key=${AI_GATEWAY_API_KEY:}
assistant.gateway.model=${AI_GATEWAY_MODEL:openai/gpt-4.1-mini}
assistant.gateway.temperature=${AI_GATEWAY_TEMPERATURE:0.2}
assistant.gateway.max-tokens=${AI_GATEWAY_MAX_TOKENS:600}

# ===================== Supabase Storage =====================
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=product-images

# ===================== Multipart File Upload =====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
